services:
  # ── MySQL Database ──────────────────────────────────────────
  mysql:
    image: mysql:8.2
    container_name: shopsphere-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-shopSphere@2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shopsphere}
      MYSQL_USER: ${MYSQL_USERNAME:-shopsphere_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shopSphere@2024}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - shopsphere-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # ── MongoDB ─────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: shopsphere-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:-mongoadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-mongoPass@2024}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-shopsphere_mongo}
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - shopsphere-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      timeout: 10s
      retries: 5

  # ── Spring Boot Backend ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopsphere-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shopsphere}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-shopsphere_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shopSphere@2024}
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-shopsphere_mongo}
      MONGODB_USERNAME: ${MONGODB_USERNAME:-mongoadmin}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:-mongoPass@2024}
      JWT_SECRET: ${JWT_SECRET:-defaultSecretKeyThatShouldBeChangedInProduction256Bit}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-86400000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      FILE_UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"
    networks:
      - shopsphere-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── React Frontend ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
        VITE_APP_NAME: ShopSphere
    container_name: shopsphere-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - shopsphere-network

  # ── Nginx Reverse Proxy ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: shopsphere-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/var/www/uploads:ro
    networks:
      - shopsphere-network

# ── Persistent Volumes ────────────────────────────────────────
volumes:
  mysql_data:
    driver: local
  mongo_data:
    driver: local
  uploads_data:
    driver: local

# ── Network ───────────────────────────────────────────────────
networks:
  shopsphere-network:
    driver: bridge