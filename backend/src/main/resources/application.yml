# ═══════════════════════════════════════════════════════════════
# ShopSphere – Application Configuration
# Base configuration shared across all profiles
# ═══════════════════════════════════════════════════════════════

spring:
  application:
    name: ShopSphere

  # ── Profile ────────────────────────────────────────────────
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ── MySQL Datasource ────────────────────────────────────────
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:shopsphere}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: ShopSphereHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # ── JPA / Hibernate ─────────────────────────────────────────
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # ── Flyway Migrations ───────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # MongoDB
  data:
    mongodb:
      uri: "mongodb://${MONGODB_USERNAME:}:${MONGODB_PASSWORD:}@${MONGODB_HOST:localhost}:${MONGODB_PORT:27017}/${MONGODB_DATABASE:shopsphere_mongo}?authSource=admin"
      auto-index-creation: true

    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}


  # ── Mail ────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # ── Thymeleaf (for email templates) ─────────────────────────
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  # ── Multipart (File Uploads) ─────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: 50MB

  # ── Jackson ─────────────────────────────────────────────────
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Kolkata
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: false

# ── Server ──────────────────────────────────────────────────
server:
  port: ${APP_PORT:8080}
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
  error:
    include-message: always
    include-binding-errors: always

# ── JWT Configuration ────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:defaultSecretKeyThatMustBeAtLeast256BitsLongForHS256Algorithm!}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:86400000}   # 24 hours
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  email-verification-expiration-ms: 86400000  # 24 hours
  password-reset-expiration-ms: 3600000        # 1 hour

# ── Razorpay ─────────────────────────────────────────────────
razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_dummy}
  key-secret: ${RAZORPAY_KEY_SECRET:dummy_secret}
  currency: ${RAZORPAY_CURRENCY:INR}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

# ── Stripe (Optional) ────────────────────────────────────────
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
  currency: INR

# ── Cloudinary ───────────────────────────────────────────────
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# ── File Storage ─────────────────────────────────────────────
file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  allowed-types: image/jpeg,image/png,image/webp,image/gif

# ── Application Constants ─────────────────────────────────────
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  name: ShopSphere
  version: 1.0.0
  email-from: ${MAIL_FROM:noreply@shopsphere.com}
  currency: INR
  currency-symbol: "₹"
  gst-rate: 18.0          # 18% GST
  shipping-charge: 49.0   # ₹49 flat shipping
  free-shipping-above: 999.0  # Free shipping above ₹999
  max-cart-items: 50
  max-wishlist-items: 100
  pagination:
    default-page-size: 12
    max-page-size: 100

# ── OpenAPI / Swagger ─────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
  info:
    title: ShopSphere API
    description: Full Stack E-Commerce Platform REST API Documentation
    version: 1.0.0
    contact:
      name: ShopSphere Team
      email: support@shopsphere.com

# ── Actuator ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ShopSphere
    version: 1.0.0
    description: Full Stack E-Commerce Platform

# ── Logging ──────────────────────────────────────────────────
logging:
  level:
    com.shopsphere: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/shopsphere.log
    max-size: 10MB
    max-history: 30
