# ── Production Profile ─────────────────────────────────────────
spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  thymeleaf:
    cache: true

logging:
  level:
    com.shopsphere: WARN
    org.springframework: WARN
    org.hibernate: WARN

server:
  error:
    include-stacktrace: never
    include-message: never
